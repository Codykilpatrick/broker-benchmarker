global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
    metrics_path: /metrics

  - job_name: 'redpanda_public'
    static_configs:
      - targets: ['redpanda:9644']
    metrics_path: /public_metrics
